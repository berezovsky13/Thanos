# Thanos Store Gateway: makes the blocks sitting in object storage
# queryable. The sidecars only serve RECENT data still on the Prometheus
# disk; everything older lives in the bucket and is served by this.
#
# NOT in the base kustomization. Task 18 applies this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-store
  namespace: monitoring
  labels:
    app: thanos-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thanos-store
  template:
    metadata:
      labels:
        app: thanos-store
    spec:
      containers:
        - name: thanos-store
          image: quay.io/thanos/thanos:v0.36.1
          args:
            - store
            - --data-dir=/var/thanos/store
            - --objstore.config-file=/etc/thanos/objstore.yml
            - --grpc-address=0.0.0.0:10901
            - --http-address=0.0.0.0:10902
            # How often it rescans the bucket for new blocks. The DEFAULT
            # IS 15 MINUTES, which makes a lab feel broken - you upload a
            # block and the Store Gateway ignores it for a quarter of an
            # hour. 1m here so tasks 19-20 respond while you watch.
            - --sync-block-duration=1m
          ports:
            - name: grpc
              containerPort: 10901
            - name: http
              containerPort: 10902
          volumeMounts:
            - name: objstore
              mountPath: /etc/thanos
            - name: data
              mountPath: /var/thanos/store
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: objstore
          secret:
            secretName: thanos-objstore
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-store
  namespace: monitoring
  labels:
    app: thanos-store
spec:
  type: ClusterIP
  selector:
    app: thanos-store
  ports:
    - name: grpc
      port: 10901
      targetPort: grpc
    - name: http
      port: 10902
      targetPort: http
