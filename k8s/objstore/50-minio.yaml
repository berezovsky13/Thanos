# MinIO: an S3-compatible object store running inside the cluster.
#
# Everything Thanos does against MinIO here is EXACTLY what it would do
# against real AWS S3 - same API, same config format. The only difference
# is the endpoint and the credentials.
#
# NOT applied by the base kustomization. Task 16 applies this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: monitoring
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-10-13T13-34-11Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: monitoring
  labels:
    app: minio
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
# Creates the bucket Thanos will write into. Runs once and exits.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: monitoring
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-10-08T09-37-26Z
          command: ["/bin/sh", "-c"]
          args:
            - |
              until mc alias set local http://minio.monitoring.svc.cluster.local:9000 minioadmin minioadmin; do
                echo "waiting for minio..."; sleep 3
              done
              mc mb --ignore-existing local/thanos
              mc ls local
              echo "bucket ready"
---
# The objstore config Thanos components read. Same YAML shape for S3, GCS,
# Azure - only `type` and `config` change.
apiVersion: v1
kind: Secret
metadata:
  name: thanos-objstore
  namespace: monitoring
type: Opaque
stringData:
  objstore.yml: |
    type: S3
    config:
      bucket: thanos
      endpoint: minio.monitoring.svc.cluster.local:9000
      access_key: minioadmin
      secret_key: minioadmin
      insecure: true          # http, not https - lab only
