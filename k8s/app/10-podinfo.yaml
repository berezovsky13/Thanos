# The thing being measured. podinfo exposes Prometheus metrics on /metrics.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: monitoring
  labels:
    app: podinfo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
        - name: podinfo
          image: stefanprodan/podinfo:6.7.1
          command: ["./podinfo", "--port=9898"]
          ports:
            - name: http
              containerPort: 9898
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: monitoring
  labels:
    app: podinfo
spec:
  type: ClusterIP
  selector:
    app: podinfo
  ports:
    - name: http
      port: 9898
      targetPort: http
